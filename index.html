<canvas id="c"></canvas>
<script>
'use strict';
// ====================================================================
//  TurtleQuest – Bring the turtle, safe to the exit!
// ====================================================================
// Das Spiel zeichnet in ein internes Bild (buf, logisch W×H). Ein Compositor bringt es danach
// auf das sichtbare Canvas: Das Canvas füllt immer den ganzen Bildschirm; im Spiel wird herangezoomt
// und die Kamera folgt der Figur, in Menüs/Overlays ist das ganze Bild eingepasst.
const cv = document.getElementById('c'), dctx = cv.getContext('2d');
const buf = document.createElement('canvas'), gctx = buf.getContext('2d');
let ctx = gctx;
const T = 32, COLS = 30, ROWS = 20, HUD = 44;
const W = COLS * T, H = ROWS * T + HUD;
let RS = 1;   // Auflösungsfaktor des internen Bilds
const view = {w:W, h:H, dpr:1, s:0, tx:0, ty:0, cx:W/2, cy:H/2, hudH:HUD, zoomed:false};
const touchMQ = matchMedia('(pointer: coarse)');
const TOUCH_TILE = 46;   // Auf Touch-Geräten mindestens so viele CSS-Pixel pro Kachel (stärkerer Zoom)
// Zoomstufe im Spiel: Bildschirm füllen, auf dem Handy zusätzlich näher an die Figur heran
function playZoom(){ const sFill = Math.max(view.w / W, view.h / H); return touchMQ.matches ? Math.max(sFill, TOUCH_TILE / T) : sFill; }
let hudSplit = 410;   // x-Position, an der die HUD-Leiste im Hochformat in zwei Zeilen geteilt wird
// Canvas an den verfügbaren Platz anpassen (Desktop, Tablet, Handy – Hoch- und Querformat)
function fit(){
  const cs = getComputedStyle(document.body);
  const vw = window.visualViewport ? visualViewport.width : innerWidth;
  const vh = window.visualViewport ? visualViewport.height : innerHeight;
  const aw = vw - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const ah = vh - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  view.w = Math.max(1, Math.floor(aw)); view.h = Math.max(1, Math.floor(ah));
  view.dpr = window.devicePixelRatio || 1;
  cv.style.width = view.w + 'px'; cv.style.height = view.h + 'px';
  cv.width = Math.round(view.w * view.dpr); cv.height = Math.round(view.h * view.dpr);
  const sFit = Math.min(view.w / W, view.h / H), sFill = Math.max(view.w / W, view.h / H);
  view.s = Math.min(playZoom(), Math.max(sFit, view.s));
  RS = Math.min(2.5, Math.max(1, playZoom() * view.dpr));
  buf.width = Math.round(W * RS); buf.height = Math.round(H * RS);
}
// Bringt das interne Bild auf den Bildschirm; zoomt sanft und lässt die Kamera der Figur folgen
function composite(){
  const zoomed = state === 'play';
  const sFit = Math.min(view.w / W, view.h / H), sFill = Math.max(view.w / W, view.h / H);
  const sPlay = playZoom(), target = zoomed ? sPlay : sFit;
  view.s += (target - view.s) * 0.08; if(Math.abs(target - view.s) < 0.002) view.s = target;
  const s = view.s, d = view.dpr;
  view.zoomed = W*s > view.w + 1 || H*s > view.h + 1;
  // HUD-Layout: passt die Leiste nicht in die Breite (Hochformat), wird sie auf zwei Zeilen aufgeteilt
  // (Die Leiste skaliert höchstens bis zur „Bildschirm füllen“-Stufe, nicht mit dem Extra-Zoom am Handy)
  const hudS = Math.min(s, sFill), oneRow = W*hudS <= view.w + 1;
  const hs = oneRow ? hudS : Math.min(hudS, view.w / Math.max(hudSplit, W - hudSplit));
  view.hudH = oneRow ? HUD*hs : 2*HUD*hs;
  view.uiS = Math.min(hudS, view.w / 520);
  // Kamera: Figur in die Mitte des Bereichs unter dem HUD, am Kartenrand anhalten
  view.cx += ((zoomed ? player.x : W/2) - view.cx) * 0.15;
  view.cy += ((zoomed ? HUD + player.y : H/2) - view.cy) * 0.15;
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  view.tx = W*s <= view.w ? (view.w - W*s) / 2 : clamp(view.w/2 - view.cx*s, view.w - W*s, 0);
  const worldFree = view.h - view.hudH - (H - HUD)*s;   // Platz unter dem HUD, falls die Karte vertikal ganz passt
  view.ty = !view.zoomed ? (view.h - H*s) / 2
          : worldFree >= 0 ? view.hudH - HUD*s + worldFree / 2
          : clamp((view.hudH + view.h)/2 - view.cy*s, view.h - H*s, view.hudH - HUD*s);
  dctx.setTransform(1,0,0,1,0,0);
  dctx.fillStyle = '#0d0b14'; dctx.fillRect(0, 0, cv.width, cv.height);
  dctx.imageSmoothingQuality = 'high';
  dctx.drawImage(buf, 0, 0, buf.width, buf.height, view.tx*d, view.ty*d, W*s*d, H*s*d);
  if(!view.zoomed) return;
  // HUD bleibt beim Zoomen oben fest stehen
  const k = sPlay > sFit ? clamp((s - sFit) / (sPlay - sFit) * 3, 0, 1) : 1;   // sanft einblenden
  dctx.globalAlpha = k;
  dctx.setTransform(d, 0, 0, d, 0, 0);
  dctx.fillStyle = '#1d1729';
  if(oneRow){
    dctx.fillRect(0, 0, view.w, HUD*hs);
    dctx.drawImage(buf, 0, 0, buf.width, HUD*RS, (view.w - W*hs) / 2, 0, W*hs, HUD*hs);
    dctx.globalAlpha = 1; return;
  }
  const rh = HUD*hs, rw = (W - hudSplit)*hs;
  dctx.fillRect(0, 0, view.w, 2*rh);
  dctx.drawImage(buf, 0, 0, hudSplit*RS, HUD*RS, 0, 0, hudSplit*hs, rh);
  dctx.drawImage(buf, hudSplit*RS, 0, (W - hudSplit)*RS, HUD*RS, view.w - rw, rh, rw, rh);
  dctx.globalAlpha = 1;
}
// UI-Elemente (Hinweise, Boss-Leiste, Toasts) direkt auf den Bildschirm zeichnen – unabhängig von der Kamera
// unten bzw. direkt unter dem HUD verankert, horizontal zentriert
function drawOverlayUI(){
  const s = view.s, d = view.dpr;
  ctx = dctx;
  if(view.zoomed){
    const u = view.uiS, ox = view.w/2 - W/2*u;
    // Auf schmalen Touch-Bildschirmen Hinweise über Joystick und Knöpfe schieben
    const bottom = view.h - (touchMQ.matches && view.w < 600 ? 205 : 0);
    dctx.setTransform(u*d, 0, 0, u*d, ox*d, (bottom - H*u) * d);
    drawBossBar(); drawMsg();
    dctx.setTransform(u*d, 0, 0, u*d, ox*d, (view.hudH - HUD*u) * d);
    drawToast();
  } else {
    dctx.setTransform(s*d, 0, 0, s*d, view.tx*d, view.ty*d);
    drawBossBar(); drawMsg(); drawToast();
  }
  ctx = gctx;
}
addEventListener('resize', fit);
addEventListener('orientationchange', () => setTimeout(fit, 100));
if(window.visualViewport) visualViewport.addEventListener('resize', fit);
fit();
// Kein Scrollen/Zoomen per Geste auf dem Handy
document.addEventListener('touchmove', e => e.preventDefault(), {passive:false});
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

// ---------------------------------------------------------------- Audio
let actx = null, muted = false;
function initAudio(){
  if(!actx){ try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }
  if(actx && actx.state === 'suspended') actx.resume();
}
function tone(f1, f2, dur, type='square', vol=0.08){
  if(!actx || muted) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f2), t+dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+0.02);
}
function noise(dur, vol=0.08, freq=1200){
  if(!actx || muted) return;
  const len = Math.floor(actx.sampleRate*dur), buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2-1)*(1-i/len);
  const s = actx.createBufferSource(); s.buffer = buf;
  const f = actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value = freq;
  const g = actx.createGain(); g.gain.value = vol;
  s.connect(f).connect(g).connect(actx.destination); s.start();
}
const SFX = {
  swing: ()=>noise(0.12,0.12,2500),
  heavy: ()=>{ noise(0.25,0.18,900); tone(160,60,0.25,'sawtooth',0.05); },
  fire:  ()=>tone(600,200,0.18,'sawtooth',0.05),
  hit:   ()=>tone(300,90,0.1,'square',0.06),
  hurt:  ()=>tone(220,70,0.3,'sawtooth',0.09),
  turtle:()=>tone(520,260,0.3,'triangle',0.1),
  kill:  ()=>tone(180,40,0.25,'square',0.06),
  pickup:()=>tone(660,990,0.12,'triangle',0.08),
  coin:  ()=>{ tone(1320,1320,0.05,'square',0.03); setTimeout(()=>tone(1760,1760,0.08,'square',0.03),45); },
  buy:   ()=>[660,880,1320].forEach((f,i)=>setTimeout(()=>tone(f,f,0.1,'triangle',0.08),i*70)),
  nope:  ()=>tone(200,120,0.15,'square',0.05),
  nova:  ()=>{ tone(1200,300,0.5,'sine',0.08); noise(0.4,0.06,4000); },
  block: ()=>tone(900,700,0.08,'square',0.05),
  arrow: ()=>tone(900,500,0.08,'triangle',0.04),
  orb:   ()=>tone(300,500,0.15,'sine',0.05),
  open:  ()=>{ tone(400,800,0.4,'triangle',0.08); setTimeout(()=>tone(600,1200,0.4,'triangle',0.08),150); },
  win:   ()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,f,0.25,'triangle',0.09),i*130)),
  shell: ()=>tone(300,500,0.1,'triangle',0.06),
};

// ---------------------------------------------------------------- Input
const keys = {}, pressed = {};
addEventListener('keydown', e => {
  initAudio();
  const k = e.key.toLowerCase();
  if(!keys[k]) pressed[k] = true;
  keys[k] = true;
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
  // Hack: Ctrl+H (bzw. Cmd+H, falls der Browser es durchlässt) öffnet im Startbildschirm die Levelauswahl
  if(k === 'h' && (e.ctrlKey || e.metaKey) && state === 'title'){ e.preventDefault(); hackOpen = true; hackSel = levelIdx; }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for(const k in keys) keys[k] = false; });
const down = (...ks) => ks.some(k => keys[k]);
const hit  = (...ks) => ks.some(k => pressed[k]);
// Virtueller Joystick (nur Handy): liefert eine analoge Richtung in stick.x/stick.y (-1..1)
const stick = {x:0, y:0, id:null};
(() => {
  const joy = document.getElementById('joy'), knob = document.getElementById('knob');
  const set = (x, y) => { stick.x = x; stick.y = y; knob.style.transform = `translate(${x*38}px, ${y*38}px)`; };
  const track = e => {
    const r = joy.getBoundingClientRect(), R = r.width/2;
    let x = (e.clientX - r.left - R) / R, y = (e.clientY - r.top - R) / R;
    const l = Math.hypot(x, y); if(l > 1){ x /= l; y /= l; }
    set(x, y);
  };
  const end = e => { if(e.pointerId !== stick.id) return; stick.id = null; set(0, 0); };
  joy.addEventListener('pointerdown', e => { initAudio(); e.preventDefault(); stick.id = e.pointerId; joy.setPointerCapture(e.pointerId); track(e); });
  joy.addEventListener('pointermove', e => { if(e.pointerId === stick.id) track(e); });
  joy.addEventListener('pointerup', end); joy.addEventListener('pointercancel', end);
  addEventListener('blur', () => { stick.id = null; set(0, 0); });
})();
// Aktionsknöpfe (nur Handy): simulieren die Tasten Leertaste (Angriff), E (Spezial) und Q (Schiggy)
const touchHeld = {attack:false};
(() => {
  const bind = (id, key, onHold) => {
    const el = document.getElementById(id); let pid = null;
    const release = () => { pid = null; keys[key] = false; el.classList.remove('on'); if(onHold) touchHeld[onHold] = false; };
    el.addEventListener('pointerdown', e => {
      e.preventDefault(); pid = e.pointerId; try{ el.setPointerCapture(pid); }catch(err){}
      initAudio();
      if(!keys[key]) pressed[key] = true; keys[key] = true; el.classList.add('on'); if(onHold) touchHeld[onHold] = true;
    });
    el.addEventListener('pointerup', e => { if(e.pointerId === pid) release(); });
    el.addEventListener('pointercancel', e => { if(e.pointerId === pid) release(); });
    addEventListener('blur', release);
  };
  bind('bAtk', ' ', 'attack'); bind('bSpc', 'e'); bind('bTurtle', 'q');
})();
// Abklingzeit/Panzer-Zustand an den Knöpfen anzeigen
function updateTouchUI(){
  if(!touchMQ.matches || state === 'title' || state === 'victory' || !player) return;
  const scd = specialCd();
  const cd = scd ? Math.min(1, Math.max(0, player.scd) / scd) : 0, bs = document.getElementById('bSpc');
  bs.style.setProperty('--cd', cd); bs.classList.toggle('cooling', cd > 0);
  document.getElementById('bTurtle').classList.toggle('shell', !!turtle.shell);
}
const mouse = {x:0, y:0, click:false};
function mpos(e){ const r = cv.getBoundingClientRect(); mouse.x = (e.clientX-r.left-view.tx)/view.s; mouse.y = (e.clientY-r.top-view.ty)/view.s; }
cv.addEventListener('mousemove', mpos);
cv.addEventListener('mousedown', e => { initAudio(); mpos(e); mouse.click = true; });

// ---------------------------------------------------------------- Daten
const WEAPONS = {
  staff:  {name:'Zauberstab',   type:'proj',  dmg:2, cd:22, speed:6.5, r:6, life:75, sfx:'fire',  rate:[5,3]},
  sword:  {name:'Schwert',      type:'melee', range:40, arc:1.9, dmg:2, kb:5,  cd:20, swing:12, sfx:'swing', col:'255,255,255', rate:[2,3]},
  axe:    {name:'Zweihandaxt',  type:'melee', range:54, arc:2.7, dmg:4, kb:9,  cd:42, swing:18, sfx:'heavy', col:'255,220,180', slow:true, rate:[3,5]},
  bow:    {name:'Bogen',        type:'proj',  dmg:2, cd:26, speed:8.5, r:5, life:70, pkind:'arrow', pierce:1, sfx:'arrow', rate:[6,3]},
  daggers:{name:'Dolche',       type:'melee', range:30, arc:1.7, dmg:1, kb:3,  cd:9,  swing:7,  sfx:'swing', col:'200,230,255', rate:[1,2]},
  spear:  {name:'Speer',        type:'melee', range:68, arc:0.8, dmg:3, kb:7,  cd:30, swing:14, sfx:'swing', col:'255,240,200', rate:[4,4]},
  hammer: {name:'Kriegshammer', type:'melee', range:46, arc:2.3, dmg:5, kb:12, cd:55, swing:20, sfx:'heavy', col:'255,230,160', slow:true, stun:30, rate:[2,6]},
  bomb:   {name:'Bomben',       type:'bomb',  dmg:4, cd:48, radius:52, rate:[4,5]},
  starblade:{name:'Sternenklinge', type:'melee', range:48, arc:2.3, dmg:3, kb:6, cd:16, swing:11, sfx:'swing', col:'255,230,120', wave:true, rate:[7,7]},
};
const SPECIALS = {
  nova:  {name:'Frostnova',      cd:360, desc:'friert alle Gegner ringsum ein',    up:'+Reichweite, schneller bereit'},
  block: {name:'Block',          cd:0,   desc:'halten: blockt, wirft Geschosse zurück', up:'Geblockte Gegner nehmen +1 Schaden'},
  whirl: {name:'Wirbelwind',     cd:240, desc:'trifft alles ringsum',              up:'+Reichweite, schneller bereit'},
  volley:{name:'Pfeilhagel',     cd:300, desc:'Fächer aus 7 Pfeilen',              up:'+2 Pfeile, schneller bereit'},
  dash:  {name:'Sturmsprung',    cd:150, desc:'Sprint nach vorn, unverwundbar', up:'+Schaden, schneller bereit'},
  heal:  {name:'Heilung',        cd:900, desc:'heilt dich und Schiggy',               up:'heilt mehr, schneller bereit'},
  quake: {name:'Erdbeben',       cd:360, desc:'betäubt alle Gegner ringsum',       up:'+Reichweite, schneller bereit'},
  meteor:{name:'Feuerkranz',     cd:330, desc:'Feuerbälle in alle Richtungen',     up:'+3 Feuerbälle, schneller bereit'},
  bubble:{name:'Schutzkuppel',   cd:720, desc:'du und Schiggy 3 s unverwundbar',      up:'hält länger, schneller bereit'},
  chain: {name:'Kettenblitz',    cd:300, desc:'Blitz springt auf bis zu 4 Gegner', up:'+1 Ziel, schneller bereit'},

// ---------------------------------------------------------------- Fortschritt (bleibt im Browser gespeichert)
const PROFILE_KEY = 'maroquest-profile-v1';
function loadProfile(){
  let pr = null;
  try{ pr = JSON.parse(localStorage.getItem(PROFILE_KEY)); }catch(e){}
  if(!pr || typeof pr !== 'object') pr = {};
  pr.got = Array.isArray(pr.got) ? pr.got : [];
  pr.c = pr.c && typeof pr.c === 'object' ? pr.c : {};
  for(const h of HEROES) if(!h.unlock && !pr.got.includes(h.id)) pr.got.push(h.id);
  return pr;
}
let profile = loadProfile(), toasts = [];
function saveProfile(){ try{ localStorage.setItem(PROFILE_KEY, JSON.stringify(profile)); }catch(e){} }
const isUnlocked = h => profile.got.includes(h.id);
const unlockProgress = h => Math.min(h.unlock.n, h.unlock.stat === 'heroes'
  ? profile.got.filter(id => id !== h.id).length : (profile.c[h.unlock.stat] || 0));
function checkUnlocks(){
  let any = false;
  for(let pass=0; pass<2; pass++) for(const h of HEROES) if(!isUnlocked(h) && unlockProgress(h) >= h.unlock.n){
    profile.got.push(h.id); toasts.push({hero:h, life:h.ulti ? 400 : 260}); any = true;
  }
  if(any) setTimeout(() => SFX.win(), 200);
  saveProfile();
}
function track(key, n=1){ if(hackRun) return; profile.c[key] = (profile.c[key] || 0) + n; checkUnlocks(); }
function trackMax(key, v){ if(hackRun) return; if((profile.c[key] || 0) < v){ profile.c[key] = v; checkUnlocks(); } }

  {key:'bite',    icon:'bite',   name:'Schiggys Biss',   max:4, base:8,  desc:()=>run.up.bite >= 1 ? '+1 Biss-Schaden, schneller (ab Stufe 2 betäubt)' : '+1 Biss-Schaden, Schiggy beißt schneller'},
];
const upName = u => typeof u.name === 'function' ? u.name() : u.name;
const upCost = u => Math.round(u.base * (1 + 0.75*run.up[u.key]));
// abgeleitete Werte
function heroSpeed(){ return HEROES[heroIdx].speed + 0.2*run.up.speed; }
function atkCd(base){ return Math.round(base * (1 - 0.1*run.up.speed)); }
function specialCd(){ return Math.round(SPECIALS[HEROES[heroIdx].special].cd * (1 - 0.12*run.up.special)); }
function heroWeapon(h = HEROES[heroIdx]){ return Object.assign({}, WEAPONS[h.weapon], h.wmod || {}); }

// grid: 0 = Boden, 1 = Wand, 2 = Lava/Wasser
function solid(tx,ty){ return tx<0 || ty<0 || tx>=COLS || ty>=ROWS || grid[ty][tx] !== 0; }
function wall(tx,ty){ return tx<0 || ty<0 || tx>=COLS || ty>=ROWS || grid[ty][tx] === 1; }
function solidPx(x,y){ return solid(Math.floor(x/T), Math.floor(y/T)); }
function wallPx(x,y){ return wall(Math.floor(x/T), Math.floor(y/T)); }
function blocked(x,y,r,fly){
  const test = fly ? wallPx : solidPx;
  for(const ox of [-r,0,r]) for(const oy of [-r,0,r]) if(test(x+ox, y+oy)) return true;
  return false;
}
function move(e, dx, dy){
  const steps = Math.ceil(Math.max(Math.abs(dx), Math.abs(dy)) / 6) || 1;
  const sx = dx/steps, sy = dy/steps; let hitWall = false;
  for(let i=0;i<steps;i++){
    if(!blocked(e.x+sx, e.y, e.r, e.fly)) e.x += sx;
    else { hitWall = true;
      if(Math.abs(sy) < 0.01){ // Ecken-Hilfe: in Gänge hineingleiten
        const cy = (Math.floor(e.y/T)+0.5)*T, n = Math.sign(cy-e.y)*Math.min(1.5, Math.abs(cy-e.y));
        if(n && !blocked(e.x, e.y+n, e.r, e.fly)) e.y += n;
      }
    }
    if(!blocked(e.x, e.y+sy, e.r, e.fly)) e.y += sy;
    else { hitWall = true;
      if(Math.abs(sx) < 0.01){
        const cx = (Math.floor(e.x/T)+0.5)*T, n = Math.sign(cx-e.x)*Math.min(1.5, Math.abs(cx-e.x));
        if(n && !blocked(e.x+n, e.y, e.r, e.fly)) e.x += n;
      }
    }
  }
  return hitWall;
}
function los(x1,y1,x2,y2,walk){
  const d = Math.hypot(x2-x1, y2-y1), n = Math.ceil(d/8), test = walk ? solidPx : wallPx;
  for(let i=1;i<n;i++){ const t = i/n; if(test(x1+(x2-x1)*t, y1+(y2-y1)*t)) return false; }
  return true;
}
function losFat(e, tgt){
  const dx = tgt.x-e.x, dy = tgt.y-e.y, d = Math.hypot(dx,dy) || 1;
  const px = -dy/d*e.r*0.9, py = dx/d*e.r*0.9;
  const w = !e.fly;
  return los(e.x,e.y,tgt.x,tgt.y,w) && los(e.x+px,e.y+py,tgt.x+px,tgt.y+py,w) && los(e.x-px,e.y-py,tgt.x-px,tgt.y-py,w);
}
function bfs(sx,sy){
  const f = new Int16Array(COLS*ROWS).fill(-1);
  const tx = Math.floor(sx/T), ty = Math.floor(sy/T);
  if(solid(tx,ty)) return f;
  const q = [tx+ty*COLS]; f[q[0]] = 0; let h = 0;
  while(h < q.length){
    const i = q[h++], x = i % COLS, y = (i/COLS)|0;
    for(const [dx,dy] of DIRS4){
      const nx = x+dx, ny = y+dy; if(solid(nx,ny)) continue;
      const j = nx+ny*COLS; if(f[j] < 0){ f[j] = f[i]+1; q.push(j); }
    }
  }
  return f;
}
function steer(e, tgt, field){
  const dx = tgt.x-e.x, dy = tgt.y-e.y, d = Math.hypot(dx,dy) || 1;
  if(d < T*1.2 || losFat(e,tgt)) return {x:dx/d, y:dy/d, d};
  const tx = Math.floor(e.x/T), ty = Math.floor(e.y/T), cur = field[tx+ty*COLS];
  let best = null, bv = cur < 0 ? 9999 : cur;
  for(const [ax,ay] of DIRS4){
    const nx = tx+ax, ny = ty+ay; if(solid(nx,ny)) continue;
    const v = field[nx+ny*COLS]; if(v >= 0 && v < bv){ bv = v; best = [nx,ny]; }
  }
  if(!best) return {x:dx/d, y:dy/d, d};
  const vx = (best[0]+.5)*T - e.x, vy = (best[1]+.5)*T - e.y, l = Math.hypot(vx,vy) || 1;
  return {x:vx/l, y:vy/l, d};
}

// ---------------------------------------------------------------- Level laden
const CHILL_SPEED = 0.7, CHILL_TIME = 120; // Frostbolt: 30 % langsamer für 2 s
const ENEMY_HP_MULT = 4; // Lebenspunkte aller Gegner (inkl. Bosse und Beschwörungen)
function makeEnemy(c,x,y){
  const d = ETYPES[c], hp = d.hp * ENEMY_HP_MULT;
  return {...d, hp, maxhp:hp, x, y, kx:0, ky:0, hitCd:0, atkCd:60+Math.random()*90, aggroed:false,
          fly: d.kind === 'bat', leap:0, wind:0, lx:0, ly:0,
          frozen:0, slow:0, stun:0, flash:0, anim:Math.random()*100, face:Math.PI/2, wa:Math.random()*6.28, wt:0, summon:300};
}
function loadLevel(i){
  const L = LEVELS[i];
  grid = []; liquid = []; enemies = []; projs = []; parts = []; pickups = []; floats = []; msg = null;
  let ps, ts;
  for(let y=0;y<ROWS;y++){
    grid[y] = [];
    for(let x=0;x<COLS;x++){
      const c = L.map[y][x], cx = x*T+T/2, cy = y*T+T/2;
      grid[y][x] = c === '#' ? 1 : c === '~' ? 2 : 0;
      if(c === '~') liquid.push([x,y]);
      if(c === 'P') ps = {x:cx, y:cy};
      else if(c === 'T') ts = {x:cx, y:cy};
      else if(c === 'E') exitPos = {x:cx, y:cy};
      else if(c === 'h') pickups.push({type:'heart', x:cx, y:cy, t:0});
      else if(c === 'l') pickups.push({type:'salad', x:cx, y:cy, t:0});
      else if(ETYPES[c]) enemies.push(makeEnemy(c,cx,cy));
    }
  }
  const Hh = HEROES[heroIdx];
  run.gold = run.goldAtStart;
  const php = Hh.hp + run.up.hp, thp = 5 + run.up.turtle;
  player = {x:ps.x, y:ps.y, r:11, hp:php, maxhp:php, face:0, cd:0, scd:0, inv:0, kx:0, ky:0,
            anim:0, swing:0, swingMax:1, spin:0, blocking:false, moving:false, dash:0, dashHit:null, bubble:0};
  turtle = {x:ts.x, y:ts.y, r:10, hp:thp, maxhp:thp, inv:0, shell:false, face:0, anim:0, kx:0, ky:0, moving:false, bite:0, biteCd:0, biteFace:0};
  exitOpen = false; fieldTimer = 0; shake = 0;
  // ein paar Münzen liegen verstreut im Level
  const free = [];
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++)
    if(L.map[y][x] === '.' && Math.hypot(x*T+T/2-ps.x, y*T+T/2-ps.y) > 5*T) free.push([x,y]);
  for(let n=0;n<6 && free.length;n++){ const [x,y] = free.splice(Math.floor(Math.random()*free.length),1)[0]; pickups.push({type:'coin', x:x*T+T/2, y:y*T+T/2, t:Math.random()*60, vx:0, vy:0}); }
  renderBg();
}

function renderBg(){
  bg = document.createElement('canvas'); bg.width = Math.round(COLS*T*RS); bg.height = Math.round(ROWS*T*RS);
  const g = bg.getContext('2d'), pal = LEVELS[levelIdx].pal;
  g.scale(RS, RS);
  let seed = levelIdx*9973 + 17;
  const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    const px = x*T, py = y*T;
    if(!wall(x,y)){
      g.fillStyle = (x+y)%2 ? pal.f1 : pal.f2; g.fillRect(px,py,T,T);
      g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(px,py,T,1); g.fillRect(px,py,1,T);
      for(let k=0;k<4;k++){ g.fillStyle = rnd()<.5 ? 'rgba(255,255,255,.04)' : 'rgba(0,0,0,.12)'; g.fillRect(px+rnd()*28, py+rnd()*28, 2+rnd()*3, 2); }
      if(rnd() < .08){ g.strokeStyle='rgba(0,0,0,.3)'; g.lineWidth=1; g.beginPath(); let cx=px+rnd()*T, cy=py+rnd()*T; g.moveTo(cx,cy); for(let k=0;k<3;k++){ cx+=rand(-7,7); cy+=rand(-7,7); g.lineTo(cx,cy);} g.stroke(); }
    }
  }
  // Schatten unter Wänden
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    if(wall(x,y)) continue;
    const px = x*T, py = y*T;
    if(wall(x,y-1)){ const gr = g.createLinearGradient(0,py,0,py+12); gr.addColorStop(0,'rgba(0,0,0,.45)'); gr.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=gr; g.fillRect(px,py,T,12); }
    if(wall(x-1,y)){ g.fillStyle='rgba(0,0,0,.22)'; g.fillRect(px,py,5,T); }
  }
  // Lava / Wasser
  for(const [x,y] of liquid){
    const px = x*T, py = y*T;
    g.fillStyle = pal.lq; g.fillRect(px,py,T,T);
    for(let k=0;k<3;k++){ g.fillStyle = pal.lq2; g.globalAlpha = .5; g.beginPath(); g.ellipse(px+4+rnd()*24, py+4+rnd()*24, 3+rnd()*5, 2+rnd()*2, 0, 0, 6.283); g.fill(); g.globalAlpha = 1; }
    g.fillStyle = 'rgba(0,0,0,.35)';
    if(!solid(x,y-1)) g.fillRect(px,py,T,4);
    if(!solid(x-1,y)) g.fillRect(px,py,3,T);
    if(!solid(x+1,y)) g.fillRect(px+T-3,py,3,T);
    if(!solid(x,y+1)) g.fillRect(px,py+T-2,T,2);
  }
  // Wände
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
    if(!wall(x,y)) continue;
    const px = x*T, py = y*T;
    g.fillStyle = pal.wt; g.fillRect(px,py,T,T);
    g.fillStyle = 'rgba(255,255,255,.06)'; g.fillRect(px+3+rnd()*10, py+3+rnd()*10, 8, 3);
    if(y+1 < ROWS && !wall(x,y+1)){
      g.fillStyle = pal.w; g.fillRect(px, py+T-13, T, 13);
      g.fillStyle = pal.ws;
      g.fillRect(px, py+T-13, T, 1); g.fillRect(px, py+T-7, T, 1);
      const off = (x%2)*8; g.fillRect(px+off+4, py+T-13, 1, 6); g.fillRect(px+off+20, py+T-13, 1, 6); g.fillRect(px+12-off/2, py+T-7, 1, 7);
    }
    g.fillStyle = pal.ws;
    if(!wall(x-1,y)) g.fillRect(px,py,2,T);
    if(!wall(x+1,y)) g.fillRect(px+T-2,py,2,T);
    if(!wall(x,y-1)) g.fillRect(px,py,T,2);
  }
  // Vignette
  const vg = g.createRadialGradient(COLS*T/2, ROWS*T/2, 200, COLS*T/2, ROWS*T/2, 620);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.45)');
  g.fillStyle = vg; g.fillRect(0,0,COLS*T,ROWS*T);
}

// ---------------------------------------------------------------- Effekte
function burst(x,y,color,n=10,spd=3,life=30,size=3){
  for(let i=0;i<n;i++){ const a = Math.random()*6.283, s = Math.random()*spd;
    parts.push({x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:life*rand(.6,1), max:life, color, size}); }
}
function floatText(x,y,text,color){ floats.push({x,y,text,color,life:45}); }
function showMsg(text, life=150){ msg = {text, life}; }

// ---------------------------------------------------------------- Kampf
function damageEnemy(e, dmg, kx, ky){
  if(e.hp <= 0) return;
  e.hp -= dmg; e.flash = 8; e.aggroed = true;
  const kb = e.kind === 'boss' ? 0.15 : e.kind === 'orc' ? 0.6 : 1;
  e.kx += kx*kb; e.ky += ky*kb;
  floatText(e.x, e.y-e.r-6, '-'+dmg, '#ffd166');
  burst(e.x, e.y, {slime:'#5fd97a', bat:'#7a5a99', skel:'#e8e4d8', orc:'#7a9a3a', ghost:'#dfe8ff', spider:'#6a4a7a'}[e.kind] || (e.final ? '#ff4d4d' : '#c34dff'), 6, 2.5, 20);
  SFX.hit();
  if(e.hp <= 0){
    stats.kills++; SFX.kill();
    track('kills'); track('k_' + e.kind); if(e.kind === 'boss') track(e.final ? 'boss2' : 'boss1');
    burst(e.x, e.y, '#ffffff', 14, 3.5, 30, 3);
    if(e.kind === 'boss') { burst(e.x, e.y, '#c34dff', 60, 6, 60, 4); shake = 14; }
    for(let c=0;c<(COIN_DROP[e.kind]||1);c++){ const a = Math.random()*6.283, sp = rand(1,3) * (e.kind === 'boss' ? 1.8 : 1);
      pickups.push({type:'coin', x:e.x, y:e.y, t:Math.random()*60, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, delay:25}); }
    if(e.kind !== 'boss'){
      if(Math.random() < 0.13) pickups.push({type:'heart', x:e.x, y:e.y, t:0});
      else if(turtle.hp < turtle.maxhp && Math.random() < 0.1) pickups.push({type:'salad', x:e.x, y:e.y, t:0});
    }
  }
}
function meleeHit(range, arc, dmg, kb, stun=0){
  const P = player; let any = false;
  for(const e of enemies){
    const d = dist(P,e) - e.r;
    if(d > range) continue;
    const a = Math.atan2(e.y-P.y, e.x-P.x);
    if(arc < 6.2 && angDiff(a, P.face) > arc/2 && d > 6) continue;
    damageEnemy(e, dmg, Math.cos(a)*kb, Math.sin(a)*kb); any = true;
    if(stun && e.hp > 0) e.stun = Math.max(e.stun, e.kind === 'boss' ? 10 : stun);
  }
  // Pfeile mit der Klinge zerschlagen
  for(const p of projs){
    if(p.owner !== 'e') continue;
    const d = Math.hypot(p.x-P.x, p.y-P.y);
    if(d < range+6 && (arc >= 6.2 || angDiff(Math.atan2(p.y-P.y, p.x-P.x), P.face) < arc/2)){ p.dead = true; burst(p.x,p.y,'#ddd',5,2,15,2); }
  }
  return any;
}
function isBlocked(sx, sy){
  const P = player;
  return HEROES[heroIdx].special === 'block' && P.blocking && angDiff(Math.atan2(sy-P.y, sx-P.x), P.face) < 1.2;
}
function hurtPlayer(dmg, sx, sy){
  const P = player;
  if(P.inv > 0 || P.dash > 0 || P.bubble > 0 || state !== 'play') return false;
  const a = Math.atan2(P.y-sy, P.x-sx);
  P.hp -= dmg; P.inv = 60; P.kx += Math.cos(a)*5; P.ky += Math.sin(a)*5;
  shake = 8; SFX.hurt(); burst(P.x, P.y, '#ff4d4d', 10, 3, 25);
  floatText(P.x, P.y-20, '-'+dmg, '#ff6b6b');
  if(P.hp <= 0){ P.hp = 0; die(HEROES[heroIdx].name + ' wurde besiegt!'); }
  return true;
}
function hurtTurtle(dmg, sx, sy){
  const t = turtle;
  if(t.shell || t.inv > 0 || player.bubble > 0 || state !== 'play') return false;
  const a = Math.atan2(t.y-sy, t.x-sx);
  t.hp -= dmg; t.inv = 70; t.kx += Math.cos(a)*4; t.ky += Math.sin(a)*4;
  shake = 6; SFX.turtle(); burst(t.x, t.y, '#8fc75a', 10, 3, 25);
  floatText(t.x, t.y-18, '-'+dmg, '#9cff6a');
  if(t.hp <= 1 && t.hp > 0) showMsg('Schiggy ist schwer verletzt! Drück Q, damit Schiggy sich im Panzer versteckt.', 200);
  if(t.hp <= 0){ t.hp = 0; die('Schiggy wurde besiegt!'); }
  return true;
}
function die(reason){ deadReason = reason; state = 'dead'; stateTimer = 0; stats.retries++; }

// ---------------------------------------------------------------- Spieler
function updatePlayer(){
  const P = player, Hh = HEROES[heroIdx], Wp = heroWeapon();
  let mx = (down('d','arrowright')?1:0) - (down('a','arrowleft')?1:0);
  let my = (down('s','arrowdown')?1:0) - (down('w','arrowup')?1:0);
  let mag = 1;
  const sm = Math.hypot(stick.x, stick.y);
  if(!mx && !my && sm > 0.2){ mx = stick.x; my = stick.y; mag = Math.min(1, (sm - 0.2) / 0.6); }
  P.blocking = Hh.special === 'block' && down('e','k','shift');
  let sp = heroSpeed() * (P.blocking ? 0.5 : 1);
  if(Wp.slow && P.swing > 0) sp *= 0.5;
  P.moving = !!(mx || my);
  if(P.dash > 0){
    // Sturmsprung: schnell nach vorn, trifft jeden Gegner einmal
    P.dash--; P.anim += 0.5;
    const dx = Math.cos(P.face), dy = Math.sin(P.face);
    move(P, dx*7, dy*7);
    parts.push({x:P.x, y:P.y, vx:0, vy:0, life:12, max:12, color:Hh.look.c2 || '#fff', size:5});
    for(const e of enemies){ if(e.hp > 0 && !P.dashHit.has(e) && dist(P,e) < P.r + e.r + 6){ P.dashHit.add(e); damageEnemy(e, 2 + run.up.special + run.up.dmg, dx*6, dy*6); } }
  } else {
    if(P.moving){
      const l = Math.hypot(mx,my); mx /= l; my /= l;
      if(!P.blocking) P.face = Math.atan2(my,mx);
      P.anim += 0.25;
    }
    move(P, mx*sp*mag + P.kx, my*sp*mag + P.ky);
  }
  P.kx *= 0.8; P.ky *= 0.8;
  if(P.cd > 0) P.cd--; if(P.scd > 0) P.scd--; if(P.inv > 0) P.inv--; if(P.swing > 0) P.swing--; if(P.spin > 0) P.spin--; if(P.bubble > 0) P.bubble--;

  if((hit(' ','j') || touchHeld.attack) && P.cd <= 0 && !P.blocking && P.spin <= 0 && P.dash <= 0) doAttack(P, Hh, Wp);
  if(Hh.special !== 'block' && hit('e','k','shift') && P.scd <= 0 && P.dash <= 0) doSpecial(P, Hh, Wp);
}
function doAttack(P, Hh, Wp){
  const fx = Math.cos(P.face), fy = Math.sin(P.face), dmg = Wp.dmg + run.up.dmg;
  if(Wp.type === 'proj'){
    projs.push({x:P.x+fx*12, y:P.y+fy*12, vx:fx*Wp.speed, vy:fy*Wp.speed, r:Wp.r, dmg, owner:'p', kind:Wp.pkind || 'fire',
                color:Hh.pc || '#ff9a3c', life:Wp.life, pierce:Wp.pierce || 0, ice:!!Wp.ice, chill:!!Wp.chill, hits:new Set()});
    P.cd = atkCd(Wp.cd); P.swing = P.swingMax = 10; SFX[Wp.sfx]();
  } else if(Wp.type === 'melee'){
    meleeHit(Wp.range, Wp.arc, dmg, Wp.kb, Wp.stun || 0);
    P.cd = atkCd(Wp.cd); P.swing = P.swingMax = Wp.swing; SFX[Wp.sfx]();
    if(Wp.slow) shake = Math.max(shake, 3);
    if(Wp.wave) projs.push({x:P.x+fx*14, y:P.y+fy*14, vx:fx*7, vy:fy*7, r:10, dmg:2+run.up.dmg, owner:'p', kind:'wave', life:42, pierce:3, hits:new Set()});
    parts.push({type:'arc', x:P.x, y:P.y, a:P.face, arc:Wp.arc, r:Wp.range - 4, life:Math.max(5, Wp.swing-2), max:Math.max(5, Wp.swing-2), color:Wp.col});
  } else {
    projs.push({x:P.x+fx*12, y:P.y+fy*12, vx:fx*5.5, vy:fy*5.5, r:6, dmg, owner:'p', kind:'bomb', life:34, radius:Wp.radius});
    P.cd = atkCd(Wp.cd); P.swing = P.swingMax = 10; tone(300,200,0.1,'triangle',0.05);
  }
}
function explode(x, y, R, dmg){
  for(const e of enemies){ const d = Math.hypot(e.x-x, e.y-y) - e.r; if(d < R){ const a = Math.atan2(e.y-y, e.x-x); damageEnemy(e, dmg, Math.cos(a)*7, Math.sin(a)*7); } }
  parts.push({type:'ring', x, y, r:R, life:18, max:18, color:'255,170,60'});
  burst(x, y, '#ff9a3c', 24, 4.5, 30, 4); burst(x, y, '#555', 12, 2.5, 40, 5);
  shake = Math.max(shake, 7); noise(0.35, 0.2, 600);
}
function doSpecial(P, Hh, Wp){
  const L = run.up.special, D = run.up.dmg, f = P.face;
  P.scd = specialCd();
  switch(Hh.special){
    case 'nova': {
      const R = 120 + 25*L;
      for(const e of enemies){ if(dist(P,e) - e.r < R){ const a = Math.atan2(e.y-P.y, e.x-P.x); damageEnemy(e, 2+D, Math.cos(a)*4, Math.sin(a)*4); e.frozen = e.kind === 'boss' ? 60 : 150; } }
      for(const p of projs) if(p.owner === 'e' && Math.hypot(p.x-P.x, p.y-P.y) < R) p.dead = true;
      parts.push({type:'ring', x:P.x, y:P.y, r:R, life:24, max:24, color:'140,220,255'});
      burst(P.x, P.y, '#bfefff', 40, 5, 35, 3); SFX.nova(); break; }
    case 'whirl': {
      const R = 70 + 12*L;
      meleeHit(R, 7, 3+D, 10); P.spin = 26; SFX.heavy(); shake = 6;
      parts.push({type:'ring', x:P.x, y:P.y, r:R, life:20, max:20, color:'255,200,140'}); break; }
    case 'volley': {
      const n = 7 + 2*L;
      for(let i=0;i<n;i++){ const a = f + (i-(n-1)/2)*0.12;
        projs.push({x:P.x, y:P.y, vx:Math.cos(a)*8.5, vy:Math.sin(a)*8.5, r:5, dmg:2+D, owner:'p', kind:'arrow', life:60, pierce:1, hits:new Set()}); }
      SFX.arrow(); setTimeout(SFX.arrow, 60); P.swing = P.swingMax = 10; break; }
    case 'dash':
      P.dash = 13; P.dashHit = new Set(); tone(400,900,0.15,'sawtooth',0.05); break;
    case 'heal': {
      const ph = 1 + Math.floor(L/2), th = 2 + L;
      player.hp = Math.min(player.maxhp, player.hp + ph); turtle.hp = Math.min(turtle.maxhp, turtle.hp + th);
      floatText(P.x, P.y-22, '+'+ph, '#ff7b9c'); floatText(turtle.x, turtle.y-20, '+'+th, '#9cff6a');
      for(const t of [P, turtle]){ parts.push({type:'ring', x:t.x, y:t.y, r:40, life:24, max:24, color:'160,255,160'}); burst(t.x, t.y, '#b8ffb0', 16, 2, 35, 3); }
      SFX.pickup(); setTimeout(SFX.pickup, 120); break; }
    case 'quake': {
      const R = 140 + 20*L;
      for(const e of enemies){ if(dist(P,e) - e.r < R){ const a = Math.atan2(e.y-P.y, e.x-P.x); damageEnemy(e, 1+D, Math.cos(a)*3, Math.sin(a)*3); if(e.hp > 0) e.stun = e.kind === 'boss' ? 40 : 100; } }
      parts.push({type:'ring', x:P.x, y:P.y, r:R, life:26, max:26, color:'200,160,100'});
      burst(P.x, P.y, '#a08060', 40, 5, 40, 4); shake = 12; noise(0.5,0.25,300); break; }
    case 'meteor': {
      const n = 12 + 3*L;
      for(let i=0;i<n;i++){ const a = i/n*6.283;
        projs.push({x:P.x, y:P.y, vx:Math.cos(a)*5.5, vy:Math.sin(a)*5.5, r:6, dmg:2+D, owner:'p', kind:'fire', color:'#ff7a1a', life:60, hits:new Set()}); }
      SFX.fire(); shake = 5; break; }
    case 'starfall': {
      const targets = enemies.filter(e => e.hp > 0);
      targets.forEach((e, i) => { const life = 22 + i*4;
        projs.push({kind:'star', owner:'p', x:e.x + rand(-60,60), y:e.y - 340, tx:e.x, ty:e.y, target:e, life, vx:0, vy:0, r:0, dmg:5 + 2*L + D}); });
      player.hp = Math.min(player.maxhp, player.hp + 1); turtle.hp = Math.min(turtle.maxhp, turtle.hp + 1);
      P.bubble = Math.max(P.bubble, 90);
      parts.push({type:'ring', x:P.x, y:P.y, r:90, life:30, max:30, color:'255,220,120'});
      burst(P.x, P.y, '#fff3b0', 40, 5, 40, 3); shake = 6;
      [880,1175,1320,1760].forEach((f,i) => setTimeout(() => tone(f, f*0.5, 0.4, 'triangle', 0.07), i*90));
      if(!targets.length) P.scd = 60;
      break; }
    case 'bubble':
      P.bubble = 180 + 60*L; tone(500,1000,0.4,'sine',0.07); break;
    case 'chain': {
      const n = 4 + L, pts = [{x:P.x, y:P.y}], hitSet = new Set();
      let from = P;
      for(let i=0;i<n;i++){
        let best = null, bd = 260;
        for(const e of enemies){ if(e.hp > 0 && !hitSet.has(e)){ const d = dist(from, e); if(d < bd){ bd = d; best = e; } } }
        if(!best) break;
        hitSet.add(best); pts.push({x:best.x, y:best.y}); damageEnemy(best, 3+D, 0, 0); from = best;
      }
      if(pts.length > 1){ parts.push({type:'bolt', pts, life:16, max:16, color:'200,230,255'}); tone(1500,200,0.25,'sawtooth',0.06); }
      else { P.scd = 20; SFX.nope(); }
      break; }
  }
}

// ---------------------------------------------------------------- Schildkröte
function updateTurtle(){
  const t = turtle;
  if(hit('q','f')){
    t.shell = !t.shell; SFX.shell();
    if(t.shell) floatText(t.x, t.y-18, 'Panzer!', '#9cff6a');
    else floatText(t.x, t.y-18, 'Folge dir!', '#9cff6a');
  }
  if(t.inv > 0) t.inv--;
  t.moving = false;
  if(!t.shell){
    const d = dist(t, player);
    if(d > 40){
      const s = steer(t, player, fieldP), sp = d > 6*T ? 1.9 : 1.6;
      move(t, s.x*sp, s.y*sp); t.face = Math.atan2(s.y, s.x); t.anim += 0.18; t.moving = true;
    }
    // Schiggy beißt Gegner, die zu nahe kommen
    if(t.biteCd > 0) t.biteCd--;
    if(t.bite > 0){ t.bite--; t.face = t.biteFace; }
    if(t.biteCd <= 0){
      let best = null, bd = 1e9;
      for(const e of enemies){ const d2 = dist(t,e) - e.r; if(e.hp > 0 && d2 < t.r + 14 && d2 < bd){ bd = d2; best = e; } }
      if(best){
        const a = Math.atan2(best.y-t.y, best.x-t.x);
        t.biteFace = t.face = a; t.bite = 12; t.biteCd = 50 - 7*run.up.bite;
        damageEnemy(best, 1 + run.up.bite, Math.cos(a)*4, Math.sin(a)*4);
        if(run.up.bite >= 2 && best.hp > 0) best.stun = Math.max(best.stun, 20);
        tone(180,90,0.08,'square',0.06); floatText(t.x, t.y-20, 'Schnapp!', '#9cff6a'); track('bites');
      }
    }
  }
  move(t, t.kx, t.ky); t.kx *= 0.8; t.ky *= 0.8;
}

// ---------------------------------------------------------------- Gegner
function shoot(e, tgt, speed, kind, spread=0){
  const a = Math.atan2(tgt.y-e.y, tgt.x-e.x) + spread;
  projs.push({x:e.x+Math.cos(a)*e.r, y:e.y+Math.sin(a)*e.r, vx:Math.cos(a)*speed, vy:Math.sin(a)*speed,
              r: kind==='orb' ? 7 : 5, dmg:1, owner:'e', kind, life:200});
}
function updateEnemies(){
  const P = player, t = turtle;
  for(const e of enemies){
    e.anim++; if(e.flash > 0) e.flash--; if(e.hitCd > 0) e.hitCd--;
    if(e.frozen > 0 || e.stun > 0){
      if(e.frozen > 0) e.frozen--; if(e.stun > 0) e.stun--; if(e.slow > 0) e.slow--;
      if(e.kind === 'ghost'){ e.x += e.kx; e.y += e.ky; } else move(e, e.kx, e.ky);
      e.kx *= 0.82; e.ky *= 0.82; continue;
    }
    const dp = dist(e,P), dtu = t.shell ? Infinity : dist(e,t);
    if(!e.aggroed){
      const ghost = e.kind === 'ghost';
      if((dp < e.aggro && (ghost || los(e.x,e.y,P.x,P.y))) || (dtu < e.aggro*0.8 && (ghost || los(e.x,e.y,t.x,t.y)))){
        e.aggroed = true;
        floatText(e.x, e.y-e.r-10, '!', '#ff5555');
        if(e.kind === 'boss') showMsg(e.name + ' erhebt sich!', 160);
      }
    }
    const tgt = dtu < dp ? t : P, field = tgt === t ? fieldT : fieldP;
    let vx = 0, vy = 0;
    if(!e.aggroed){
      // herumstreunen
      if(--e.wt <= 0){ e.wt = 60+Math.random()*90; e.wa = Math.random() < .3 ? null : Math.random()*6.283; }
      if(e.wa !== null){ vx = Math.cos(e.wa)*e.speed*0.35; vy = Math.sin(e.wa)*e.speed*0.35; e.face = e.wa; }
    } else {
      const s = steer(e, tgt, field), d = Math.hypot(tgt.x-e.x, tgt.y-e.y);
      e.face = Math.atan2(tgt.y-e.y, tgt.x-e.x);
      if(e.kind === 'slime'){
        const hop = 0.3 + Math.abs(Math.sin(e.anim*0.08));
        vx = s.x*e.speed*hop; vy = s.y*e.speed*hop;
      } else if(e.kind === 'bat'){
        const w = Math.sin(e.anim*0.12)*0.9;
        vx = (s.x - s.y*w)*e.speed; vy = (s.y + s.x*w)*e.speed;
      } else if(e.kind === 'orc'){
        vx = s.x*e.speed; vy = s.y*e.speed;
      } else if(e.kind === 'skel'){
        const see = los(e.x,e.y,tgt.x,tgt.y);
        if(!see || d > 7*T){ vx = s.x*e.speed; vy = s.y*e.speed; }
        else if(d < 4*T){ vx = -s.x*e.speed; vy = -s.y*e.speed; }
        else { const side = Math.sin(e.anim*0.02) > 0 ? 1 : -1; vx = -s.y*side*e.speed*0.5; vy = s.x*side*e.speed*0.5; }
        if(--e.atkCd <= 0 && see && d < 10*T){ shoot(e, tgt, 3.4, 'arrow'); SFX.arrow(); e.atkCd = 100+Math.random()*50; }
      } else if(e.kind === 'ghost'){
        const dd = d || 1, w = Math.sin(e.anim*0.05)*0.5;
        vx = ((tgt.x-e.x)/dd - (tgt.y-e.y)/dd*w)*e.speed; vy = ((tgt.y-e.y)/dd + (tgt.x-e.x)/dd*w)*e.speed;
      } else if(e.kind === 'spider'){
        if(e.leap > 0){ e.leap--; vx = e.lx*5; vy = e.ly*5; }
        else if(e.wind > 0){
          if(--e.wind === 0){ const a = Math.atan2(tgt.y-e.y, tgt.x-e.x); e.lx = Math.cos(a); e.ly = Math.sin(a); e.leap = 16; tone(500,900,0.12,'square',0.04); }
        } else {
          vx = s.x*e.speed; vy = s.y*e.speed;
          if(--e.atkCd <= 0 && d < 4.5*T && los(e.x,e.y,tgt.x,tgt.y,true)){ e.wind = 28; e.atkCd = 110 + Math.random()*40; }
        }
      } else if(e.kind === 'boss'){
        vx = s.x*e.speed; vy = s.y*e.speed;
        const enraged = e.final || e.hp < e.maxhp/2;
        if(--e.atkCd <= 0){
          e.phase = (e.phase||0) + 1;
          if(e.phase % 2){ const n = enraged ? 16 : 12, off = Math.random();
            for(let i=0;i<n;i++){ const a = i/n*6.283 + off; projs.push({x:e.x, y:e.y, vx:Math.cos(a)*2.4, vy:Math.sin(a)*2.4, r:7, dmg:1, owner:'e', kind:'orb', life:260}); }
          } else { for(let i=-2;i<=2;i++) shoot(e, tgt, 3.2, 'orb', i*0.18); }
          SFX.orb(); e.atkCd = enraged ? 95 : 140;
        }
        if(enraged && --e.summon <= 0){
          e.summon = e.final ? 420 : 480;
          const minion = e.final ? 'g' : 'b';
          for(let i=0;i<2;i++){ const b = makeEnemy(minion, e.x+rand(-30,30), e.y+rand(-30,30)); b.aggroed = true; if(minion === 'g' || !blocked(b.x,b.y,b.r,true)) enemies.push(b); }
          burst(e.x, e.y, e.final ? '#ff4d4d' : '#c34dff', 20, 4, 30); showMsg(e.name + (e.final ? ' ruft Geister!' : ' ruft Fledermäuse!'), 100);
        }
      }
    }
    if(e.slow > 0){ e.slow--; vx *= CHILL_SPEED; vy *= CHILL_SPEED; }
    if(e.kind === 'ghost'){ // schwebt durch Wände
      e.x = Math.max(T, Math.min(COLS*T-T, e.x + vx + e.kx)); e.y = Math.max(T, Math.min(ROWS*T-T, e.y + vy + e.ky));
    } else if(move(e, vx + e.kx, vy + e.ky)){ if(!e.aggroed) e.wt = 0; if(e.leap > 0) e.leap = 0; }
    e.kx *= 0.82; e.ky *= 0.82;

    // Berührungsschaden
    if(e.hitCd <= 0){
      if(dist(e,P) < e.r + P.r - 2){
        if(isBlocked(e.x, e.y)){
          const a = Math.atan2(e.y-P.y, e.x-P.x); e.kx += Math.cos(a)*7; e.ky += Math.sin(a)*7; e.stun = 30 + 10*run.up.special;
          if(run.up.special) damageEnemy(e, run.up.special, 0, 0);
          SFX.block(); burst((e.x+P.x)/2, (e.y+P.y)/2, '#fff6a0', 8, 3, 15, 2);
        } else hurtPlayer(e.dmg, e.x, e.y);
        e.hitCd = 50;
      } else if(!t.shell && dist(e,t) < e.r + t.r - 2){
        hurtTurtle(e.dmg, e.x, e.y); e.hitCd = 50;
        const a = Math.atan2(e.y-t.y, e.x-t.x); e.kx += Math.cos(a)*3; e.ky += Math.sin(a)*3;
      }
    }
  }
  // Abstand halten
  for(let i=0;i<enemies.length;i++) for(let j=i+1;j<enemies.length;j++){
    const a = enemies[i], b = enemies[j], d = dist(a,b), m = a.r + b.r;
    if(d < m && d > 0.01){ const o = (m-d)/2*0.5, nx = (b.x-a.x)/d, ny = (b.y-a.y)/d; move(a, -nx*o, -ny*o); move(b, nx*o, ny*o); }
  }
  const before = enemies.length;
  enemies = enemies.filter(e => e.hp > 0);
  if(before > 0 && enemies.length === 0 && !exitOpen){
    exitOpen = true; SFX.open(); showMsg('Alle Gegner besiegt – der Ausgang ist offen!', 180);
    burst(exitPos.x, exitPos.y, '#7fffd4', 30, 4, 40);
  }
}

// ---------------------------------------------------------------- Geschosse
function updateProjs(){
  const P = player, t = turtle;
  for(const p of projs){
    if(p.kind === 'star'){ // Sternensturm: fällt auf sein Ziel
      if(p.target.hp > 0){ p.tx = p.target.x; p.ty = p.target.y; }
      p.life--; const k = 1 / Math.max(1, p.life);
      p.x += (p.tx - p.x)*k; p.y += (p.ty - p.y)*k;
      parts.push({x:p.x, y:p.y, vx:rand(-.3,.3), vy:-.5, life:16, max:16, color:Math.random() < .5 ? '#fff3b0' : '#ffd34d', size:3});
      if(p.life <= 0){
        p.dead = true;
        for(const e of enemies) if(e.hp > 0 && Math.hypot(e.x-p.x, e.y-p.y) - e.r < 34){ damageEnemy(e, p.dmg, 0, 0); if(e.hp > 0) e.stun = Math.max(e.stun, e.kind === 'boss' ? 15 : 60); }
        parts.push({type:'ring', x:p.x, y:p.y, r:40, life:16, max:16, color:'255,230,140'});
        burst(p.x, p.y, '#fff3b0', 18, 4, 28, 3); shake = Math.max(shake, 4); noise(0.2, 0.12, 2000);
      }
      continue;
    }
    p.x += p.vx; p.y += p.vy; p.life--;
    if(p.kind === 'fire' && Math.random() < .6) parts.push({x:p.x, y:p.y, vx:rand(-.4,.4), vy:rand(-.4,.4), life:14, max:14, color:p.color || '#ff9a3c', size:3});
    if(p.kind === 'bomb'){ p.vx *= 0.95; p.vy *= 0.95; if(Math.random() < .5) parts.push({x:p.x+2, y:p.y-8, vx:rand(-.5,.5), vy:-.5, life:10, max:10, color:'#ffd34d', size:2}); }
    if(p.kind === 'orb' && Math.random() < .3) parts.push({x:p.x, y:p.y, vx:0, vy:0, life:12, max:12, color:'#b04dff', size:3});
    if(p.kind === 'bomb'){
      let boom = p.life <= 0 || wallPx(p.x, p.y);
      for(const e of enemies) if(e.hp > 0 && Math.hypot(p.x-e.x, p.y-e.y) < e.r + p.r) boom = true;
      if(boom){ p.dead = true; explode(p.x - (wallPx(p.x,p.y) ? p.vx : 0), p.y - (wallPx(p.x,p.y) ? p.vy : 0), p.radius, p.dmg); }
      continue;
    }
    if(p.life <= 0) { p.dead = true; continue; }
    if(wallPx(p.x, p.y)){ p.dead = true; burst(p.x-p.vx, p.y-p.vy, p.kind==='fire' ? (p.color || '#ff9a3c') : '#aaa', 6, 2, 15, 2); continue; }
    if(p.owner === 'p'){
      for(const e of enemies){
        if(e.hp > 0 && !(p.hits && p.hits.has(e)) && Math.hypot(p.x-e.x, p.y-e.y) < e.r + p.r){
          const a = Math.atan2(p.vy, p.vx); damageEnemy(e, p.dmg, Math.cos(a)*4, Math.sin(a)*4);
          if(p.ice && e.hp > 0) e.frozen = Math.max(e.frozen, e.kind === 'boss' ? 10 : 35);
          if(p.chill && e.hp > 0) e.slow = CHILL_TIME; // Frostbolt: verlangsamt um 30 %
          burst(p.x, p.y, p.kind==='fire' ? (p.color || '#ffb347') : p.kind==='wave' ? '#ffe680' : '#fff6a0', 10, 3, 20);
          if(p.pierce > 0){ p.pierce--; if(p.hits) p.hits.add(e); else p.hits = new Set([e]); continue; }
          p.dead = true; break;
        }
      }
    } else {
      if(Math.hypot(p.x-P.x, p.y-P.y) < P.r + p.r){
        if(isBlocked(p.x - p.vx*3, p.y - p.vy*3)){
          // zurückwerfen!
          const a = P.face + rand(-0.15, 0.15), sp = Math.hypot(p.vx,p.vy)*1.4;
          p.vx = Math.cos(a)*sp; p.vy = Math.sin(a)*sp; p.owner = 'p'; p.dmg = 2 + run.up.dmg + run.up.special; p.life = 120;
          SFX.block(); burst(p.x, p.y, '#fff6a0', 8, 3, 15, 2);
        } else if(P.inv <= 0){ hurtPlayer(p.dmg, p.x-p.vx, p.y-p.vy); p.dead = true; }
      } else if(Math.hypot(p.x-t.x, p.y-t.y) < t.r + p.r){
        if(t.shell){ p.dead = true; burst(p.x, p.y, '#cfe8b0', 6, 2, 15, 2); SFX.block(); }
        else if(t.inv <= 0){ hurtTurtle(p.dmg, p.x-p.vx, p.y-p.vy); p.dead = true; }
      }
    }
  }
  projs = projs.filter(p => !p.dead);
}

function updatePickups(){
  for(const k of pickups){
    k.t++;
    if(k.type === 'coin'){
      if(k.vx || k.vy){ move(Object.assign(k,{r:4}), k.vx, k.vy); k.vx *= 0.9; k.vy *= 0.9; if(Math.abs(k.vx)+Math.abs(k.vy) < 0.05) k.vx = k.vy = 0; }
      if(k.delay > 0){ k.delay--; continue; }
      const d = dist(k, player);
      if(d < 80){ const sp = 2 + (80-d)/12; k.x += (player.x-k.x)/d*sp; k.y += (player.y-k.y)/d*sp; }
      if(d < 14){ k.dead = true; run.gold++; run.totalGold++; track('gold'); SFX.coin(); floatText(k.x, k.y-12, '+1', '#ffd34d'); }
      continue;
    }
    if(k.type === 'heart' && player.hp < player.maxhp && dist(k,player) < 20){
      player.hp++; k.dead = true; SFX.pickup(); floatText(k.x, k.y-14, '+1', '#ff7b9c');
    }
    if(k.type === 'salad' && turtle.hp < turtle.maxhp && (dist(k,player) < 20 || dist(k,turtle) < 20)){
      turtle.hp = Math.min(turtle.maxhp, turtle.hp+2); k.dead = true; SFX.pickup(); floatText(turtle.x, turtle.y-18, 'Mampf! +2', '#9cff6a');
    }
  }
  pickups = pickups.filter(k => !k.dead);
}
function updateParts(){
  for(const p of parts){ p.life--; if(!p.type){ p.x += p.vx; p.y += p.vy; p.vx *= 0.92; p.vy *= 0.92; } }
  parts = parts.filter(p => p.life > 0);
  for(const f of floats){ f.life--; f.y -= 0.5; }
  floats = floats.filter(f => f.life > 0);
  if(msg && --msg.life <= 0) msg = null;
}
function checkExit(){
  if(dist(player, exitPos) > 24) return;
  if(!exitOpen){ if(!msg) showMsg('Der Ausgang ist versiegelt. Besiege zuerst alle Gegner!', 90); return; }
  if(dist(turtle, exitPos) < 44){
    state = 'levelwin'; stateTimer = 0; SFX.win();
    trackMax('level', levelIdx+1); trackMax('lvl_' + HEROES[heroIdx].id, levelIdx+1); burst(exitPos.x, exitPos.y, '#7fffd4', 40, 5, 50);
  } else if(!msg){
    showMsg(turtle.shell ? 'Schiggy steckt im Panzer! Drück Q, damit Schiggy dir folgt.' : 'Warte auf Schiggy! Ohne die Schildkröte geht es nicht weiter.', 90);
  }
}

// ---------------------------------------------------------------- Hauptupdate
function startGame(){ hackRun = false; levelIdx = 0; stats = {kills:0, time:0, retries:0}; run = newRun(); loadLevel(0); state = 'intro'; }
function leaveShop(){ run.goldAtStart = run.gold; levelIdx++; loadLevel(levelIdx); state = 'intro'; }
function buyUpgrade(i){
  const u = UPGRADES[i];
  if(run.up[u.key] >= u.max || run.gold < upCost(u)){ SFX.nope(); shopFlash = -20; return; }
  run.gold -= upCost(u); run.up[u.key]++; SFX.buy(); shopFlash = 20;
}
const SHOP = {w:680, rowH:52};
const shopY0 = () => H/2 - 250;
function updateShop(){
  const n = UPGRADES.length;
  if(shopFlash > 0) shopFlash--; else if(shopFlash < 0) shopFlash++;

function update(){
  globalTime++;
  if(toasts.length && --toasts[0].life <= 0) toasts.shift();
  if(hit('m')) muted = !muted;
  switch(state){
    case 'title': updateTitle(); break;
    case 'intro': if(hit('enter',' ') || mouse.click) state = 'play'; break;
    case 'play':
      if(hit('p','escape')){ state = 'pause'; break; }
      stats.time++;
      if(--fieldTimer <= 0){ fieldP = bfs(player.x, player.y); fieldT = bfs(turtle.x, turtle.y); fieldTimer = 12; }
      updatePlayer(); updateTurtle(); updateEnemies(); updateProjs(); updatePickups(); updateParts(); checkExit();
      shake *= 0.85;
      break;
    case 'pause':
      if(hit('p','escape')) state = 'play';
      else if(hit('r')){ loadLevel(levelIdx); state = 'intro'; }
      else if(hit('h')) state = 'title';
      break;
    case 'dead':
      stateTimer++; updateParts(); shake *= 0.85;
      if(stateTimer > 40 && (hit('r','enter') || mouse.click)){ loadLevel(levelIdx); state = 'intro'; }
      else if(hit('h')) state = 'title';
      break;
    case 'levelwin':
      stateTimer++; updateParts();
      if(stateTimer > 110){
        if(levelIdx < LEVELS.length-1){ state = 'shop'; shopSel = 0; }
        else { state = 'victory'; stateTimer = 0; }
      }
      break;
    case 'shop': updateShop(); break;
    case 'victory':
      stateTimer++;
      if(stateTimer > 60 && (hit('enter',' ') || mouse.click)) state = 'title';
      break;
  }
}

const GRID = {x:34, y:116, cols:5, cell:90, gap:8};

const cellRect = i => i === ULTI_IDX ? [ULTI_CELL.x, ULTI_CELL.y, ULTI_CELL.w, ULTI_CELL.h] : [...cellPos(i), GRID.cell, GRID.cell];

const HACK = {w:420, rowH:34};
const hackY0 = () => H/2 - (LEVELS.length*HACK.rowH)/2 - 30;
function updateHack(){
  const n = LEVELS.length;
  if(hit('escape')){ hackOpen = false; return; }
  if(hit('arrowup','w'))   hackSel = (hackSel + n - 1) % n;
  if(hit('arrowdown','s')) hackSel = (hackSel + 1) % n;
  for(let i=0;i<n;i++) if(hit(String((i+1) % 10))) hackSel = i; // 1–9, 0 = Level 10
  let clicked = false;
  for(let i=0;i<n;i++){ const ry = hackY0() + 50 + i*HACK.rowH;
    if(mouse.x > W/2-HACK.w/2+12 && mouse.x < W/2+HACK.w/2-12 && mouse.y > ry && mouse.y < ry+HACK.rowH-4){ hackSel = i; if(mouse.click) clicked = true; } }
  if(hit('enter',' ') || clicked){
    // Direktstart ohne Freischalt-Prüfung; Fortschritt wird in diesem Lauf nicht gespeichert
    hackOpen = false; hackRun = true; levelIdx = hackSel;
    stats = {kills:0, time:0, retries:0}; run = newRun(); loadLevel(levelIdx); state = 'intro';
  }
}
function updateTitle(){
  if(hackOpen){ updateHack(); return; }
  const n = HEROES.length, C = GRID.cols;
  if(hit('arrowleft','a'))  heroIdx = (heroIdx + n - 1) % n;
  if(hit('arrowright','d')) heroIdx = (heroIdx + 1) % n;
  if(hit('arrowup','w'))    heroIdx = heroIdx === ULTI_IDX ? 17 : heroIdx < C ? ULTI_IDX : heroIdx - C;
  if(hit('arrowdown','s'))  heroIdx = heroIdx === ULTI_IDX ? 2 : heroIdx >= ULTI_IDX - C ? ULTI_IDX : heroIdx + C;
  for(let i=0;i<n;i++){
    const [x,y,w,h] = cellRect(i);
    if(mouse.x > x && mouse.x < x+w && mouse.y > y && mouse.y < y+h && mouse.click){
      if(heroIdx === i) { tryStart(); return; }
      heroIdx = i;
    }
  }
  const b = startBtn();
  if(mouse.click && mouse.x > b.x && mouse.x < b.x+b.w && mouse.y > b.y && mouse.y < b.y+b.h){ tryStart(); return; }
  if(hit('enter',' ')) tryStart();
}

  g.bezierCurveTo(x-s*0.5, y+s*0.6, x, y+s*0.8, x, y+s);
  g.bezierCurveTo(x, y+s*0.8, x+s*0.5, y+s*0.6, x+s*0.5, y+s*0.3);
  g.bezierCurveTo(x+s*0.5, y, x, y, x, y+s*0.3);

}
function circle(g,x,y,r,fill,stroke,lw=2){ g.beginPath(); g.arc(x,y,r,0,6.2832); if(fill){ g.fillStyle = fill; g.fill(); } if(stroke){ g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); } }

function eyes(g,face,hx,hy,col='#1a1a1a',sp=2.5,r=1.4){
  const fx = Math.cos(face), fy = Math.sin(face);

  circle(g, hx+fx*3+px*sp, hy+fy*2+py*sp*0.4, r, col);

      ctx.fillStyle = 'rgba(255,240,160,.15)'; ctx.strokeStyle = 'rgba(255,240,160,.8)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(t.x, t.y-2, 21, 0, 6.283); ctx.fill(); ctx.stroke();
    }
  }

    ctx.strokeStyle = 'rgba(255,240,150,.55)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(P.x, P.y, 20, P.face-1.2, P.face+1.2); ctx.stroke();

}

// --- Schildkröte
function drawTurtle(g, t, scale=1){
  g.save(); g.translate(t.x, t.y); g.scale(scale, scale);
  if(t.inv > 0 && (t.inv >> 2) % 2) g.globalAlpha = 0.4;
  shadow(g, 12, 5, 8);
  const f = t.face, fx = Math.cos(f), fy = Math.sin(f);
  if(!t.shell){
    const step = t.moving ? Math.sin(t.anim)*2.5 : 0;
    for(const [a, ph] of [[0.75,1],[-0.75,-1],[2.4,-1],[-2.4,1]]){
      const la = f + a; circle(g, Math.cos(la)*10 + fx*step*ph, Math.sin(la)*9 + fy*step*ph + 2, 3.6, '#8fc75a', '#4c7a2a', 1);
    }
    circle(g, -fx*12, -fy*10+2, 2, '#8fc75a');
    const lunge = t.bite > 0 ? Math.sin((12 - t.bite)/12*Math.PI)*7 : 0;
    const hx = fx*(13+lunge), hy = fy*(11+lunge) + 1;
    if(lunge){ g.strokeStyle = '#8fc75a'; g.lineWidth = 5; g.beginPath(); g.moveTo(fx*8, fy*7+1); g.lineTo(hx, hy); g.stroke(); }
    circle(g, hx, hy, 5.5, '#9ad466', '#4c7a2a', 1.2);
    if(lunge > 2){ g.fillStyle = '#5a1a1a'; g.beginPath(); g.moveTo(hx+fx*2, hy+fy*2); g.arc(hx+fx*2, hy+fy*2, 4, t.face-0.5, t.face+0.5); g.closePath(); g.fill(); }
    if(fy > -0.6){ circle(g, hx+fx*2-fy*2.2, hy+fy*1.5+fx*0.5-1, 1.3, '#111'); circle(g, hx+fx*2+fy*2.2, hy+fy*1.5-fx*0.5-1, 1.3, '#111'); }
  }
  const wob = t.shell ? Math.sin(globalTime*0.3)*0.04 : 0;
  g.rotate(wob);
  g.beginPath(); g.ellipse(0,0,12.5,11,0,0,6.2832); g.fillStyle = t.shell ? '#25632a' : '#2e7d32'; g.fill();
  g.strokeStyle = '#174a1b'; g.lineWidth = 2; g.stroke();
  g.fillStyle = t.shell ? '#357a39' : '#43a047';
  g.beginPath(); for(let i=0;i<6;i++){ const a = i/6*6.283; g.lineTo(Math.cos(a)*5, Math.sin(a)*4.5 - 1); } g.closePath(); g.fill();
  g.strokeStyle = 'rgba(20,60,20,.8)'; g.lineWidth = 1;
  for(let i=0;i<6;i++){ const a = i/6*6.283; g.beginPath(); g.moveTo(Math.cos(a)*5, Math.sin(a)*4.5 - 1); g.lineTo(Math.cos(a)*11, Math.sin(a)*9.5); g.stroke(); }
  g.fillStyle = 'rgba(255,255,255,.18)'; g.beginPath(); g.ellipse(-4,-5,4,2,-.4,0,6.2832); g.fill();
  g.restore();
  if(t.shell){ g.fillStyle = '#cfe8b0'; g.font = 'bold 11px sans-serif'; g.textAlign = 'center'; g.fillText('z', t.x+10, t.y-14 - Math.sin(globalTime*0.05)*2); }
}

function drawParts(){
  const g = ctx;
  for(const p of parts){
    const a = p.life/p.max;
    if(p.type === 'arc'){
      g.strokeStyle = `rgba(${p.color},${a*0.8})`; g.lineWidth = 6*a + 1;
      g.beginPath(); g.arc(p.x, p.y, p.r*(1.1-a*0.2), p.a - p.arc/2, p.a + p.arc/2); g.stroke();
    } else if(p.type === 'bolt'){
      g.strokeStyle = `rgba(${p.color},${a})`; g.lineWidth = 3*a + 1; g.shadowColor = '#bfe8ff'; g.shadowBlur = 10;
      g.beginPath(); g.moveTo(p.pts[0].x, p.pts[0].y);
      for(let i=1;i<p.pts.length;i++){ const A = p.pts[i-1], B = p.pts[i];
        for(let k=1;k<=4;k++){ const t = k/4; g.lineTo(A.x + (B.x-A.x)*t + (k<4 ? rand(-6,6) : 0), A.y + (B.y-A.y)*t + (k<4 ? rand(-6,6) : 0)); } }
      g.stroke(); g.shadowBlur = 0;
    } else if(p.type === 'ring'){
      g.strokeStyle = `rgba(${p.color},${a})`; g.lineWidth = 4*a + 1;
      g.beginPath(); g.arc(p.x, p.y, p.r*(1-a*0.7), 0, 6.283); g.stroke();
    } else {
      g.globalAlpha = a; g.fillStyle = p.color; g.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size); g.globalAlpha = 1;
    }
  }
  g.textAlign = 'center'; g.font = 'bold 14px "Trebuchet MS", sans-serif';
  for(const f of floats){ g.globalAlpha = Math.min(1, f.life/20); g.fillStyle = '#000'; g.fillText(f.text, f.x+1, f.y+1); g.fillStyle = f.color; g.fillText(f.text, f.x, f.y); }
  g.globalAlpha = 1;
}

function wrap(s, maxW, size){

}

function drawWorld(){
  const g = ctx;
  g.save();
  const s = shake > 0.5 ? shake : 0;
  g.translate((Math.random()-.5)*s, HUD + (Math.random()-.5)*s);
  if(bg.width !== Math.round(COLS*T*RS)) renderBg();   // Auflösung hat sich geändert
  g.drawImage(bg, 0, 0, COLS*T, ROWS*T);
  if(liquid.length){
    const pal = LEVELS[levelIdx].pal;
    for(const [x,y] of liquid){ const a = 0.1 + 0.1*Math.sin(globalTime*0.05 + x*0.9 + y*1.3);
      g.globalAlpha = a; g.fillStyle = pal.lq2; g.fillRect(x*T, y*T, T, T); }
    g.globalAlpha = 1;
  }
  drawExit();
  for(const k of pickups) drawPickup(k);
  const list = enemies.map(e => ({y:e.y, f:() => drawEnemy(e)}));
  list.push({y:player.y, f:drawPlayer}, {y:turtle.y, f:() => drawTurtle(ctx, turtle)});
  list.sort((a,b) => a.y - b.y).forEach(o => o.f());
  for(const p of projs) drawProj(p);
  drawParts();
  g.restore();
  drawHUD();
}

  for(let i=0;i<=n;i++){
    const ry = y0 + 92 + i*SHOP.rowH, rx = x0 + 16, rw = SHOP.w - 32, rh = SHOP.rowH - 8, sel = i === shopSel;
    g.fillStyle = sel ? '#2f2648' : '#1d1730'; g.strokeStyle = sel ? '#ffd34d' : '#3a2f52'; g.lineWidth = sel ? 2 : 1;
    g.beginPath(); g.roundRect(rx, ry, rw, rh, 8); g.fill(); g.stroke();
    if(i === n){ text('Weiter zum nächsten Level  →', W/2, ry + rh/2 + 6, 18, sel ? '#7fffd4' : '#9ad8c4'); continue; }
    const u = UPGRADES[i], lvl = run.up[u.key], maxed = lvl >= u.max, cost = upCost(u), afford = run.gold >= cost;
    drawUpIcon(g, u.icon, rx + 28, ry + rh/2);
    text(upName(u), rx + 56, ry + 19, 16, '#fff', 'left');
    text(u.desc(), rx + 56, ry + 36, 13, '#b9aee0', 'left', 'normal');
    for(let b=0;b<u.max;b++){ g.fillStyle = b < lvl ? '#c9f5a8' : '#3a3150'; g.fillRect(rx + 370 + b*22, ry + rh/2 - 6, 18, 12); }
    if(maxed) text('MAX', rx + rw - 16, ry + rh/2 + 6, 16, '#c9f5a8', 'right');
    else { drawCoin(g, rx + rw - 70, ry + rh/2, 8); text(String(cost), rx + rw - 56, ry + rh/2 + 6, 17, afford ? '#ffd34d' : '#7a6a50', 'left'); }
  }
  text('↑ ↓ wählen  ·  Enter / Klick kaufen  ·  N weiter', W/2, y0 + 92 + (n+1)*SHOP.rowH + 18, 13, '#9a90b8', 'center', 'normal');
}

function drawVictory(){
  const g = ctx;
  const gr = g.createLinearGradient(0,0,0,H); gr.addColorStop(0,'#123a2e'); gr.addColorStop(1,'#0b0812');
  g.fillStyle = gr; g.fillRect(0,0,W,H);
  for(let i=0;i<40;i++){ const x = (i*97 + globalTime*(1+i%3)) % W, y = (i*53 + globalTime*0.7*(1+i%2)) % H;
    g.fillStyle = `hsl(${(i*40+globalTime)%360},80%,65%)`; g.fillRect(x, y, 4, 4); }
  text('Sieg!', W/2, 150, 72, '#7fffd4');
  text(`${HEROES[heroIdx].name} hat Schiggy sicher durch alle Gewölbe gebracht.`, W/2, 205, 20, '#e8e0ff', 'center', 'normal');
  g.save(); g.translate(W/2-50, 330); g.scale(3,3); drawHero(g, HEROES[heroIdx], 0, 0, Math.PI/2, {moving:true, anim:globalTime*0.2, swing:0, swingMax:1, spin:0}); g.restore();
  drawTurtle(g, {x:W/2+60, y:340, face:Math.PI, anim:globalTime*0.2, moving:true, shell:false, inv:0}, 3);
  const secs = Math.floor(stats.time/60);
  text(`Zeit: ${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')}   ·   Besiegte Gegner: ${stats.kills}   ·   Neuversuche: ${stats.retries}   ·   Gold: ${run.totalGold}`, W/2, 460, 18, '#cfc4f0', 'center', 'normal');
  if(stateTimer > 60) text('Enter: zurück zum Hauptmenü', W/2, 530, 18, (globalTime>>5)%2 ? '#fff' : '#9a90b8');
}

// ---------------------------------------------------------------- Loop
let last = performance.now(), acc = 0;
const STEP = 1000/60;
function frame(now){
  acc += Math.min(100, now - last); last = now;
  while(acc >= STEP){
    update(); acc -= STEP;
    for(const k in pressed) delete pressed[k];
    mouse.click = false;
  }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
